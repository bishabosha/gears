name: test
on:
  push:
    branches:
      - main
  pull_request:
jobs:
  formatting-check:
    strategy:
      fail-fast: false
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0
    - uses: coursier/cache-action@v6
    - uses: actions/setup-java@v3
      with:
        distribution: temurin
        java-version: 21
    - uses: sbt/setup-sbt@v1
    - name: Test Formatting
      run: sbt scalafmtCheckAll
  test-jvm:
    strategy:
      fail-fast: false
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0
    - uses: coursier/cache-action@v6
    - uses: actions/setup-java@v3
      with:
        distribution: temurin
        java-version: 21
    - uses: sbt/setup-sbt@v1
    - name: Test
      run: sbt rootJVM/test
  test-native:
    strategy:
      fail-fast: false
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0
    - uses: coursier/cache-action@v6
    - uses: actions/setup-java@v3
      with:
        distribution: temurin
        java-version: 21
    - uses: sbt/setup-sbt@v1
    - name: Install scala-native dependencies
      run: sudo apt-get install clang libstdc++-12-dev libgc-dev
    - name: Test
      # Restart the server so the next invocation picks up GC_MAXIMUM_HEAP_SIZE.
      run: sbt 'rootNative/test; shutdown'
    - name: Stress Test with Lower Memory
      run: env GC_MAXIMUM_HEAP_SIZE=140M sbt 'rootNative/testOnly StressTest'
  # The I/O projects that run anywhere: the NIO backend and the demos on the JVM. A newer JDK than the core's, for the
  # virtual-thread carriers' internals and the plain JDK bench's StructuredTaskScope, as tested.
  test-io-jvm:
    strategy:
      fail-fast: false
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0
    - uses: coursier/cache-action@v6
    - uses: actions/setup-java@v3
      with:
        distribution: temurin
        java-version: 27
    - uses: sbt/setup-sbt@v1
    - name: Test
      run: sbt 'ioNio/test; ioDemosJVM/test'
  # The backends for macOS alone, kqueue and Network.framework, which neither build nor run on Linux, and what uses
  # them: the demos on Scala Native, and the tests driving the demo executables.
  test-io-macos:
    strategy:
      fail-fast: false
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0
    - uses: coursier/cache-action@v6
    - uses: actions/setup-java@v3
      with:
        distribution: temurin
        java-version: 27
    - uses: sbt/setup-sbt@v1
    # The core's I/O on Darwin; the rest of the core runs on Linux, its timing tests' bounds too tight for these
    # runners. Each step runs whether or not the one before passed, so that every suite reports.
    - name: Test the core's I/O
      run: sbt 'rootNative/testOnly gears.async.io.* callers.*'
    - name: Test kqueue
      if: ${{ !cancelled() }}
      run: sbt ioKqueue/test
    - name: Test Network.framework
      if: ${{ !cancelled() }}
      run: sbt ioNWFramework/test
    - name: Test the demos
      if: ${{ !cancelled() }}
      run: sbt 'ioDemosNative/test; ioDemosTests/test'
  test-js:
    strategy:
      fail-fast: false
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0
    - uses: coursier/cache-action@v6
    - uses: actions/setup-java@v3
      with:
        distribution: temurin
        java-version: 21
    - uses: actions/setup-node@v4
      with:
          node-version: '26'
    - uses: sbt/setup-sbt@v1
    - name: Test
      run: sbt rootJS/test
